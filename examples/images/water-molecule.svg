<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-labelledby="title">
  <title id="title">A water molecule: one oxygen atom bonded to two hydrogen atoms</title>
  <rect width="320" height="220" fill="#ffffff"/>
  <g stroke="#475569" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="70" x2="96" y2="140"/>
    <line x1="160" y1="70" x2="224" y2="140"/>
  </g>
  <path d="M 140 98 A 36 36 0 0 0 180 98" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="160" cy="62" r="34" fill="#ef4444"/>
  <circle cx="92" cy="146" r="24" fill="#3b82f6"/>
  <circle cx="228" cy="146" r="24" fill="#3b82f6"/>
  <g font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <text x="160" y="72" font-size="28">O</text>
    <text x="92" y="155" font-size="22">H</text>
    <text x="228" y="155" font-size="22">H</text>
  </g>
  <text x="160" y="200" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#334155">H–O–H, about 104.5°</text>
</svg>
